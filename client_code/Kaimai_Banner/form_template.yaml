components: []
container:
  properties:
    html: |-
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Header with Navbar</title>
          <div class="custom-top-banner">
            <img src="https://kaimai.co.uk/hs-fs/hubfs/kaimai%20IMAGE.png?width=346&height=100&name=kaimai%20IMAGE.png" alt="Kaimai Logo" class="banner-logo">

          </div>

          <style>
            /* Inline Styling for the top banner (like the black "Anvil" header) */
            .custom-top-banner {
              background-color: white;
              color: black;
              padding: 10px 20px; /* Reduced top/bottom padding */
              text-align: left; /* Align content to the left */
              font-size: 1.5em;
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              z-index: 900;
              display: flex; /* Use flexbox for layout */
              align-items: center; /* Vertically center items */
            }

            .banner-logo {
              max-height: 40px; /* Limit the height of the logo */
              width: auto; /* Maintain aspect ratio */
              margin-right: 20px; /* Add some space between logo and text */
            }

            .banner-text {
              flex-grow: 1; /* Allow text to take up remaining space */
            }

            <div anvil-slot="default"></div>
  type: HtmlTemplate
custom_component: true
is_package: true
