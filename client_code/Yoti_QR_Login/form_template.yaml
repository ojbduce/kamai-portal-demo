components:
- layout_properties: {slot: default}
  name: spacer_1
  properties: {height: 48.75}
  type: Spacer
- components:
  - layout_properties: {grid_position: 'KRDDGA,FFOTPF'}
    name: label_1
    properties: {align: center, bold: true, font_size: 28, text: Login With, underline: false}
    type: Label
  - layout_properties: {grid_position: 'PBIYNL,RUEGFM'}
    name: image_1
    properties: {display_mode: shrink_to_fit, height: 39.828125, horizontal_align: center, source: _/theme/yoti-logo.png, vertical_align: bottom}
    type: Image
  - event_bindings: {show: label_loading_show}
    layout_properties: {grid_position: 'SBDUBV,CVZIFO'}
    name: label_loading
    properties: {align: center}
    type: Label
  - layout_properties: {grid_position: 'QNMGDP,JPCFFI'}
    name: column_panel_QR_Code
    properties: {}
    type: ColumnPanel
  - components:
    - event_bindings: {click: button_show_tests_click}
      layout_properties: {grid_position: 'FYRJTJ,IFIUFH'}
      name: button_show_tests
      properties: {font_size: 9, text: Unhide tests}
      type: Button
    - layout_properties: {grid_position: 'ANUVSY,MIHQEY'}
      name: button_synth_test
      properties: {bold: true, role: null, text: Synthetic Login}
      type: Button
    - event_bindings: {click: button_home_click}
      layout_properties: {grid_position: 'MYASBH,SHHJGF'}
      name: button_home
      properties: {bold: true, role: null, text: Home Test}
      type: Button
    layout_properties: {grid_position: 'DSKFEB,RRTEAD'}
    name: column_panel_2
    properties: {}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: column_panel_1
  properties: {}
  type: ColumnPanel
container:
  properties:
    html: |-
      <!-- Custom banner HTML starts here -->
      <div class="banner">
          <a href="/">
              <img class="logo" src="https://kaimai.co.uk/hs-fs/hubfs/kaimai%20IMAGE.png?width=346&height=100&name=kaimai%20IMAGE.png" alt="Kaimai Logo">
          </a>
      </div>
      <div anvil-slot="default"></div>
  type: HtmlTemplate
custom_component: true
is_package: true
