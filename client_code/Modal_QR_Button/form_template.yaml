components: []
container:
  event_bindings: {show: form_show}
  properties:
    html: "<head>\n    <script src=\"https://www.yoti.com/share/client/v2\"></script>\n  </head>\n  \n  <body>\n    <!-- Yoti element will be rendered inside this DOM node -->\n    <div id=\"yoti_qr\"></div>\n  \n    <!-- Yoti WebShare Script -->\n    <script>\n      const loadYoti = async () => {\n        try {\n          const { Yoti } = window;\n          if (Yoti) {\n            console.info('Waiting for Yoti...');\n            await Yoti.ready();\n            console.info('Yoti is now ready');\n          } else {\n            console.error('Yoti client was not found!');\n          }\n        } catch (error) {\n          console.error('Error during Yoti load:', error);\n        }\n      };\n  \n      const createYotiWebShare = async () => {\n        try {\n          const { Yoti } = window;\n          if (Yoti) {\n            await Yoti.createWebShare({\n              name: 'test-share',\n              domId: 'yoti_qr',\n              sdkId: '754182a1-fbf6-4a20-8615-cf4666f964cc',\n              hooks: {\n                sessionIdResolver: onSessionIdResolver,\n                errorListener: onErrorListener\n              }\n            });\n            console.info(\"Yoti WebShare successfully created\");\n          } else {\n            console.error(\"Yoti object is not available in the window\");\n          }\n        } catch (error) {\n          console.error(\"Error creating Yoti WebShare:\", error);\n        }\n      };\n  \n      async function onSessionIdResolver() {\n        try {\n          console.info(\"Requesting Yoti share data from backend...\");\n          const response = await fetch(\"https://reliable-equatorial-heron.anvil.app/_/api/sessions\", { \n            method: 'POST',\n            headers: {\n              'Content-Type': 'application/json'\n            }\n          });\n          \n          if (!response.ok) {\n            const errorText = await response.text();\n            console.error(\"Backend error response:\", errorText);\n            throw new Error(`Backend error: ${response.status} - ${errorText}`);\n          }\n\n          const data = await response.json();\n          console.info(\"Received share URL:\", data.shareUrl);\n          return data.shareUrl;\n        } catch (error) {\n          console.error(\"Error in sessionIdResolver:\", error);\n          throw error;\n        }\n      }\n  \n      function onErrorListener(...data) {\n        console.warn('Yoti encountered an error:', ...data);\n      }\n  \n      const start = async () => {\n        try {\n          await loadYoti();\n          await createYotiWebShare();\n        } catch (e) {\n          console.error(`Could not create Yoti WebShare: `, e);\n        }\n      };\n  \n      start();\n    </script>\n  </body>\n  "
  type: HtmlTemplate
custom_component: true
events:
- {default_event: true, description: clicked, name: event}
is_package: true
properties: []
