components: []
container:
  event_bindings: {show: form_show}
  properties:
    html: "<head>\n    <script src=\"https://www.yoti.com/share/client/v2\"></script>\n  </head>\n  \n  <body>\n    <!-- Yoti element will be rendered inside this DOM node -->\n    <div id=\"yoti_qr\"></div>\n  \n    <!-- Yoti WebShare Script -->\n    <script>\n      const loadYoti = async () => {\n        try {\n          const { Yoti } = window;\n          if (Yoti) {\n            console.info('Waiting for Yoti...');\n            await Yoti.ready();\n            console.info('Yoti is now ready');\n          } else {\n            console.error('Yoti client was not found!');\n          }\n        } catch (error) {\n          console.error('Error during Yoti load:', error);\n        }\n      };\n  \n      const createYotiWebShare = async () => {\n        try {\n          const { Yoti } = window;\n          if (Yoti) {\n            await Yoti.createWebShare({\n              name: 'test-share',\n              domId: 'yoti_qr',\n              sdkId: '754182a1-fbf6-4a20-8615-cf4666f964cc',\n              hooks: {\n                sessionIdResolver: onSessionIdResolver,\n                errorListener: onErrorListener\n              }\n            });\n            console.info(\"Yoti WebShare successfully created\");\n          } else {\n            console.error(\"Yoti object is not available in the window\");\n          }\n        } catch (error) {\n          console.error(\"Error creating Yoti WebShare:\", error);\n        }\n      };\n  \n       async function onSessionIdResolver() {\n        try {\n            const response = await fetch(\"https://reliable-equatorial-heron.anvil.app/_/api/sessions\", {method: 'POST' });\n            const rawText = await response.text();\n            console.log(\"Raw server response:\", rawText);\n            \n            const data = JSON.parse(rawText);\n            console.log(\"Parsed data:\", data);\n            \n            return data.sessionId;\n        } catch (error) {\n            console.error(\"Error details:\", {\n                message: error.message,\n                stack: error.stack\n            });\n            throw error;\n        }\n      }\n  \n  \n      function onErrorListener(...data) {\n        console.warn('Yoti encountered an error:', ...data);\n      }\n  \n      const start = async () => {\n        try {\n          await loadYoti();\n          await createYotiWebShare();\n        } catch (e) {\n          console.error(`Could not create Yoti WebShare: `, e);\n        }\n      };\n  \n      start().catch((e) => console.error(\"Fatal error in Yoti setup:\", e));\n    </script>\n  </body>\n  \n  "
  type: HtmlTemplate
custom_component: true
events:
- {default_event: true, description: clicked, name: event}
is_package: true
properties: []
