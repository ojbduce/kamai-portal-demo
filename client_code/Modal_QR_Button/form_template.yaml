components: []
container:
  properties:
    html: |
      <head>
        <script src="https://www.yoti.com/share/client/v2"></script>
      </head>

      <body>
        <!-- Yoti element will be rendered inside this DOM node -->
        <div id="yoti_qr"></div>

        <!-- Yoti WebShare Script -->
        <script>
          const loadYoti = async () => {
            try {
              const { Yoti } = window;
              if (Yoti) {
                console.info('Waiting for Yoti...');
                await Yoti.ready();
                console.info('Yoti is now ready');
              } else {
                console.error('Yoti client was not found!');
              }
            } catch (error) {
              console.error('Error during Yoti load:', error);
            }
          };

          const createYotiWebShare = async () => {
            try {
              const { Yoti } = window;
              if (Yoti) {
                await Yoti.createWebShare({
                  name: 'test-share',
                  domId: 'yoti_qr',
                  sdkId: '754182a1-fbf6-4a20-8615-cf4666f964cc',
                  hooks: {
                    sessionIdResolver: onSessionIdResolver,
                    errorListener: onErrorListener
                  }
                });
                console.info("Yoti WebShare successfully created");
              } else {
                console.error("Yoti object is not available in the window");
              }
            } catch (error) {
              console.error("Error creating Yoti WebShare:", error);
            }
          };

          async function onSessionIdResolver() {
        try {
          console.info("Requesting session ID from backend...");
          const response = await fetch("https://reliable-equatorial-heron.anvil.app/_/api/sessions", { method: 'POST' });
          console.log(response.status)
          // Log the response to see the exact content
          const text = await response.text();
          console.log("Response text from backend:", text);

          // Parse only if the response was OK and in JSON format
          if (response.ok) {
            const data = JSON.parse(text);
            console.info("Received session ID:", data.sessionId);
            return data.sessionId;
          } else {
            throw new Error(`Backend error: ${response.status} ${response.statusText}`);
          }
        } catch (error) {
          console.error("Error in sessionIdResolver:", error);
          return null;  // Return null to prevent further issues
        }
      }


          function onErrorListener(...data) {
            console.warn('Yoti encountered an error:', ...data);
          }

          const start = async () => {
            try {
              await loadYoti();
              await createYotiWebShare();
            } catch (e) {
              console.error(`Could not create Yoti WebShare: `, e);
            }
          };

          start().catch((e) => console.error("Fatal error in Yoti setup:", e));
        </script>
      </body>
  type: HtmlTemplate
custom_component: true
is_package: true
