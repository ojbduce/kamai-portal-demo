allow_embedding: false
db_schema:
  ads:
    client: none
    columns:
    - admin_ui: {width: 200}
      name: ad_name
      type: string
    - admin_ui: {width: 200}
      name: ad
      type: media
    - admin_ui: {width: 200}
      name: remember_me_id
      type: string
    server: full
    title: Ads
  files:
    client: none
    columns:
    - admin_ui: {width: 200}
      name: path
      type: string
    - admin_ui: {width: 200}
      name: file
      type: media
    - admin_ui: {width: 200}
      name: file_version
      type: string
    server: full
    title: Files
  reports:
    client: full
    columns:
    - admin_ui: {width: 200}
      name: report_title
      type: string
    - admin_ui: {width: 200}
      name: report
      type: string
    - admin_ui: {width: 200}
      name: remember_me_id
      target: users
      type: link_single
    server: full
    title: Reports
  sessions:
    client: none
    columns:
    - admin_ui: {width: 200}
      name: yoti_session_id
      type: string
    - admin_ui: {width: 200}
      name: time_date
      type: datetime
    server: full
    title: Sessions
  users:
    client: full
    columns:
    - admin_ui: {width: 200}
      name: remember_me_id
      type: string
    - admin_ui: {width: 200}
      name: verification_date
      type: datetime
    - admin_ui: {width: 200}
      name: email
      type: string
    - admin_ui: {width: 200}
      name: enabled
      type: bool
    - admin_ui: {width: 200}
      name: last_login
      type: datetime
    - admin_ui: {width: 200}
      name: password_hash
      type: string
    - admin_ui: {width: 200}
      name: n_password_failures
      type: number
    - admin_ui: {width: 200}
      name: confirmed_email
      type: bool
    - admin_ui: {width: 200}
      name: remembered_logins
      type: simpleObject
    - admin_ui: {width: 200}
      name: signed_up
      type: datetime
    server: full
    title: Users
dependencies:
- dep_id: dep_bo98k6a5tnruq
